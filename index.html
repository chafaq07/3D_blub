<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Take the Captain's Shot</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=JetBrains+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #e8e0d0;
      --gold: #e6b86a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #030303;
      color: var(--ink);
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
      display: block
    }

    .txt {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 300px 20px 0;
      pointer-events: none
    }

    h1 {
      font: 800 clamp(34px, 7vw, 96px)/.95 'Bricolage Grotesque', Impact, sans-serif;
      letter-spacing: -.045em;
      margin: 0 0 20px;
      background: linear-gradient(90deg, #cfc6b2 0%, #f1e9d8 60%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    h1 em {
      font-style: normal;
      background: none;
      color: var(--gold);
      -webkit-text-fill-color: var(--gold)
    }

    p {
      margin: 4px 0;
      font: 400 clamp(14px, 1.9vw, 19px)/1.4 'Bricolage Grotesque', sans-serif;
      color: #b9b19f;
      max-width: 46ch
    }

    .hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 3;
      text-align: center;
      font-size: 12px;
      color: #8a8a90;
      padding: 0 12px;
      pointer-events: none
    }

    #st {
      position: fixed;
      z-index: 3;
      left: 20px;
      top: calc(20px + env(safe-area-inset-top, 0px));
      font-size: 13px;
      line-height: 1.7;
      color: #777;
      pointer-events: none
    }

    #st b {
      color: #ddd;
      font-weight: 400
    }

    button {
      font: inherit;
      cursor: pointer
    }

    #snd {
      position: fixed;
      z-index: 3;
      right: 18px;
      top: calc(18px + env(safe-area-inset-top, 0px));
      background: #0a0a0a;
      border: 1px solid #2a2a2e;
      color: #bbb;
      border-radius: 20px;
      padding: 9px 18px;
      font-size: 13px
    }

    #snd:focus-visible,
    #chg:focus-visible {
      outline: 2px solid var(--gold)
    }

    #chg {
      display: none;
      position: fixed;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: #1a1004;
      border: 0;
      font: 700 18px 'Bricolage Grotesque', sans-serif;
      padding: 15px 30px;
      border-radius: 30px;
      box-shadow: 0 0 36px rgba(230, 184, 106, .45)
    }

    #toast {
      position: fixed;
      z-index: 3;
      left: 50%;
      top: 42%;
      transform: translateX(-50%);
      font: 800 clamp(24px, 5vw, 40px) 'Bricolage Grotesque', sans-serif;
      color: var(--gold);
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s;
      white-space: nowrap
    }
  </style>
</head>

<body>
  <div class="txt">
    <h1>Turn the lights<em> on.</em></h1>
    <p>Or knock them out with a slingshot.</p>
    <p>Your room, your rules.</p>
  </div>
  <div class="hint">tap the switch · drag the pebble back, then release · drag the lamp to swing it</div>
  <div id="st">captain-lamp · <b id="stv">on</b><br>shots <b id="sh">0</b> · bulbs <b id="bl">0</b></div>
  <button id="snd">sound: on</button><button id="chg">Change bulb</button>
  <div id="toast"></div>
